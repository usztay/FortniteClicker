name: Build FortniteClicker EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Tesseract OCR and bundle it
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          $tess = "C:\Program Files\Tesseract-OCR"
          if (!(Test-Path "$tess\tesseract.exe")) { throw "Tesseract not found" }
          New-Item -ItemType Directory -Force -Path "Tesseract-OCR" | Out-Null
          Copy-Item "$tess\*" "Tesseract-OCR\" -Recurse -Force
          New-Item -ItemType Directory -Force -Path "Tesseract-OCR\tessdata" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata" -OutFile "Tesseract-OCR\tessdata\eng.traineddata"
      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build standalone EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name FortniteClicker --add-data "Tesseract-OCR;Tesseract-OCR" fortnite_clicker.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FortniteClicker-Windows10
          path: dist/FortniteClicker.exe
          if-no-files-found: error
